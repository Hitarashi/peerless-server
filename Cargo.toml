[workspace]
resolver = "2"
members = [
    "crates/music",
    "crates/lyrics",
    "crates/engine",
    "crates/apple",
    "crates/qobuz",
    "crates/db",
    "crates/media",
    "crates/stream",
    "crates/server",
    "crates/bot",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ferogram = { git = "https://github.com/sayeed205/ferogram", branch = "fix/evict-connection-not-inited", features = ["html"] }
diesel = { version = "2", features = ["postgres", "chrono", "serde_json"] }
diesel-async = { version = "0.9", features = ["postgres", "bb8", "async-connection-wrapper"] }
diesel_migrations = "2"
tokio = { version = "1", features = ["full"] }
bytes = "1"
tokio-util = "0.7"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
regex = "1"
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
indexmap = "2"
cuid2 = "0.1"
sha2 = "0.11"
sha1 = "0.10" # pinned to rsa 0.9's digest generation; bump with rsa 0.10
rsa = { version = "0.9", features = ["sha1", "getrandom"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
ctr = "0.10"
cmac = "0.8"
base64 = "0.23"
rand = "0.10"
symphonia = { version = "0.6", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav", "aiff", "pcm"] }
realfft = "3"
png = "0.18"
mp4ameta = "0.13"
metaflac = "0.2"
id3 = "1.17"
font8x8 = "0.3"
temari = { git = "https://github.com/WorldObservationLog/Temari" }
moka = { version = "0.12", features = ["future"] }
aes-gcm = "0.11"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "yaml"] }
hmac = "0.13"
ytmusic = { git = "https://github.com/sonorahq/ytmusic-rs", rev = "e0a5174" }
lyrics-helper = { version = "0.4.0", default-features = false }



[workspace.lints.rust]
dead_code = "deny"
unused_variables = "deny"
unused_imports = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
used_underscore_binding = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
