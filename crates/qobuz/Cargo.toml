[package]
name = "qobuz"
description = "Qobuz provider: catalog, hosted worker adapter, native ripper fallback, and stream acquisition"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
engine = { path = "../engine" }
music = { path = "../music" }
media = { path = "../media" }
bytes.workspace = true
futures-util.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
tokio.workspace = true
tokio-util.workspace = true
base64.workspace = true
md-5.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
tempfile = "3"

[lints]
workspace = true
